prefix: "&8[&c&lAntyBot&8]&r "

attack-mode:
  enabled: true
  trigger-joins: 4
  trigger-seconds: 3
  duration-seconds: 60
  block-new-players: true
  require-reconnect: true
  reconnect-delay-seconds: 4

ping-check:
  enabled: true
  max-ping-age-seconds: 900 # 15 minut

ip-limit:
  enabled: true
  max-connections-per-ip: 3
  shared-ip:
    enabled: true
    extra-connections: 2 # dodatkowe sloty dla IP z zaufanym graczem (LAN/rodzenstwo)
  global-throttle:
    enabled: true
    max-joins-per-second: 15
  burst-protection:
    enabled: true
    max-connections: 5
    window-seconds: 3
  temp-block:
    enabled: true
    duration-seconds: 15
  verification-queue:
    max-concurrent-verifications: 25
  single-flight:
    enabled: true

anti-vpn:
  enabled: true
  trigger-mode: ALWAYS # ALWAYS lub ATTACK_ONLY
  provider: AUTO # AUTO, PROXYCHECK lub IP_API
  api-key: "" # opcjonalny klucz do ProxyCheck.io
  block-hosting: true # blokowanie serwerowni i centrow danych (OVH, Hetzner itp.)
  bypass-trusted: true
  cache-time-hours: 24
  max-worker-threads: 4
  max-pending-tasks: 100
  max-concurrent-requests: 5
  connect-timeout-ms: 2000
  request-timeout-ms: 2500
  global-checks-per-minute: 60
  ip-check-cooldown-seconds: 10
  overload-policy: FAIL_OPEN # FAIL_OPEN lub FAIL_CLOSED
  failure-policy: FAIL_OPEN # FAIL_OPEN lub FAIL_CLOSED
  whitelist-ips:
    - "127.0.0.1"
  whitelist-players: []

nickname-filter:
  enabled: true
  min-length: 3
  max-length: 16
  blocked-patterns:
    - "(?i)^bot_.*"
    - "(?i)^player\\d{3,}$"
    - "(?i)^mcdrop.*"
    - "(?i)^crash.*"
    - "(?i)^mcbot.*"

captcha:
  enabled: true
  trigger-mode: ALWAYS # ALWAYS lub ATTACK_ONLY
  code-length: 4
  characters: "23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz"
  timeout-seconds: 30
  max-attempts: 3
  case-sensitive: true
  allow-chat-fallback: false
  required-line: RANDOM # RANDOM, 1, 2, 3 lub 4
  open-delay-ticks: 15 # opoznienie otwarcia tabliczki po dolaczeniu (20 tickow = 1s)
  blindness: true

movement-check:
  enabled: true
  required-camera-moves: 5
  required-walk-steps: 5
  timeout-seconds: 45
  block-chat: true
  block-commands: true

auth:
  enabled: false
  premium-auto-detect: true # automatyczne logowanie kont Mojang Premium bez hasla
  timeout-seconds: 60
  max-failed-attempts: 5
  min-password-length: 4
  max-password-length: 32
  require-complex-password: true # wymaga duzej litery, malej, cyfry i znaku specjalnego
  blindness: true
  session:
    enabled: true
    timeout-minutes: 60 # auto-login po IP dla graczy non-premium

notifications:
  notify-on-attack-state: true
  notify-on-bot-block: true
  show-actionbar: true

update-checker:
  enabled: true
  github-repo: "narczoo/antibot"
  notify-admins-on-join: true
  check-interval-hours: 6

messages:
  attack-mode-kick: "&c&lSERWER CHWILOWO CHRONIONY\n\n&7Wykryto zmasowany atak botów na serwer.\n&eOdczekaj chwilę i połącz się ponownie za &a{TIME}s&e."
